<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeWipe</title>
  <style>
    :root {
      --primary: #4F46E5;
      --bg: #FAFAFA;
      --text: #1a1a2e;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 48px 24px;
      max-width: 480px;
    }
    .icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
    }
    .icon img { width: 100%; height: 100%; object-fit: contain; }
    h1 { font-size: 2rem; margin-bottom: 8px; }
    p { color: var(--muted); margin-bottom: 32px; }
    .links { display: flex; flex-direction: column; gap: 12px; }
    a {
      display: block;
      padding: 14px 24px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: background 0.2s;
    }
    a:hover { background: #f1f5f9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon"><img src="logo.png" alt="WeWipe logo"></div>
    <h1>WeWipe</h1>
    <p>Manage household chores together</p>
    <div class="links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="terms-of-service.html">Terms of Service</a>
    </div>
  </div>
</body>
</html>
